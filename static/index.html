<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Briefing</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101416; color: #eef2f0; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
    header { display: flex; align-items: end; justify-content: space-between; border-bottom: 1px solid #36413c; padding-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .status { color: #80d4a9; font: 12px ui-monospace, monospace; }
    .positions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 24px 0; background: #36413c; border: 1px solid #36413c; }
    .position { background: #171d1a; padding: 18px; }
    .label { color: #9ba8a1; font-size: 12px; text-transform: uppercase; }
    .value { margin-top: 8px; font: 22px ui-monospace, monospace; }
    .workspace { border: 1px solid #36413c; background: #171d1a; }
    #answer { min-height: 220px; padding: 22px; line-height: 1.65; white-space: pre-wrap; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px; border-top: 1px solid #36413c; }
    input { min-width: 0; border: 1px solid #4c5a53; background: #101416; color: inherit; padding: 12px; font: inherit; }
    button { border: 0; background: #4fda8c; color: #07120c; padding: 0 20px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    @media (max-width: 620px) { .positions { grid-template-columns: 1fr; } header { align-items: start; gap: 12px; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Portfolio briefing</h1><span class="status" id="status">READY</span></header>
    <section class="positions" aria-label="Portfolio positions">
      <div class="position"><div class="label">Cash</div><div class="value">$18,400</div></div>
      <div class="position"><div class="label">Treasury ETF</div><div class="value">$31,600</div></div>
      <div class="position"><div class="label">Equity ETF</div><div class="value">$50,000</div></div>
    </section>
    <section class="workspace">
      <div id="answer" aria-live="polite">Ask for a concise read on this allocation.</div>
      <form id="briefing-form">
        <input id="prompt" name="prompt" value="Summarize my liquidity and concentration risk." aria-label="Question">
        <button type="submit">Run briefing</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#briefing-form");
    const answer = document.querySelector("#answer");
    const status = document.querySelector("#status");
    const button = form.querySelector("button");

    function consumeEvent(block) {
      const lines = block.split("\n");
      const event = lines.find(line => line.startsWith("event: "))?.slice(7);
      const data = lines.find(line => line.startsWith("data: "))?.slice(6);
      if (!event || !data) return;
      const payload = JSON.parse(data);
      if (event === "delta") answer.textContent += payload.text;
      if (event === "done") status.textContent = "COMPLETE";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      answer.textContent = "";
      status.textContent = "STREAMING";
      button.disabled = true;
      const requestId = crypto.randomUUID();
      try {
        const response = await fetch("/stream", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Idempotency-Key": requestId},
          body: JSON.stringify({prompt: form.prompt.value})
        });
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload.error || `Request ${requestId} was rejected`);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let pending = "";
        while (true) {
          const {value, done} = await reader.read();
          pending += decoder.decode(value || new Uint8Array(), {stream: !done});
          const blocks = pending.split("\n\n");
          pending = blocks.pop();
          blocks.forEach(consumeEvent);
          if (done) break;
        }
      } catch (error) {
        answer.textContent = error.message;
        status.textContent = "STOPPED";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
